name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gander/shared build

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VERSION%%-*}" >> $GITHUB_ENV

      - name: Patch tauri.conf.json version
        shell: bash
        run: |
          jq --arg v "$APP_VERSION" '.version = $v' apps/client/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/client/src-tauri/tauri.conf.json

      - name: Build Tauri app
        run: pnpm --filter client tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/src-tauri/target/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/client/src-tauri/target/release/bundle/msi/*.msi
            apps/client/src-tauri/target/release/bundle/msi/*.msi.sig
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gander/shared build

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VERSION%%-*}" >> $GITHUB_ENV

      - name: Patch tauri.conf.json version
        run: |
          jq --arg v "$APP_VERSION" '.version = $v' apps/client/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/client/src-tauri/tauri.conf.json

      - name: Build Tauri app (universal macOS binary)
        run: pnpm --filter client tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: Apple code signing (requires Apple Developer account)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Publish macOS artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gander/shared build

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VERSION%%-*}" >> $GITHUB_ENV

      - name: Patch tauri.conf.json version
        run: |
          jq --arg v "$APP_VERSION" '.version = $v' apps/client/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/client/src-tauri/tauri.conf.json

      - name: Build Android APK
        working-directory: apps/client
        run: pnpm tauri android build --apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  publish-update-manifest:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VERSION%%-*}" >> $GITHUB_ENV

      - name: Download signatures from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.sig" \
            --dir sigs

      - name: List release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name' > asset_names.txt

      - name: Generate combined update manifest
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Windows NSIS installer
          WIN_EXE=$(grep '\.exe$' asset_names.txt | head -1)
          WIN_SIG=$(cat "sigs/${WIN_EXE}.sig")

          # macOS universal app bundle
          MAC_TAR=$(grep '\.app\.tar\.gz$' asset_names.txt | head -1)
          MAC_SIG=$(cat "sigs/${MAC_TAR}.sig")

          jq -n \
            --arg version "$APP_VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg win_sig "$WIN_SIG" \
            --arg win_url "${BASE_URL}/${WIN_EXE}" \
            --arg mac_sig "$MAC_SIG" \
            --arg mac_url "${BASE_URL}/${MAC_TAR}" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

      - name: Upload update manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
