name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CARGO_INCREMENTAL: 0

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Node.js setup
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust toolchain
      - uses: dtolnay/rust-toolchain@stable

      # Install prebuilt sccache (PowerShell-safe)
      - name: Install prebuilt sccache
        run: |
          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v0.14.1/sccache-v0.14.1-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\sccache.zip"
          Expand-Archive "$env:TEMP\sccache.zip" -DestinationPath "$env:USERPROFILE\.cargo\bin"
        shell: powershell

      # Add cargo bin (sccache) to PATH
      - name: Add cargo bin to PATH
        run: echo "$env:USERPROFILE\.cargo\bin" >> $GITHUB_PATH
        shell: powershell

      # Set Rust compiler wrapper
      - name: Set RUSTC_WRAPPER
        run: echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      # Verify sccache works
      - name: Verify sccache
        run: sccache --version
        shell: powershell

      # Cache Rust dependencies, target, and sccache
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/sccache
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Install project dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build shared package
      - name: Build shared package
        run: pnpm --filter @gander/shared build

      # Extract version from tag
      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VERSION%%-*}" >> $GITHUB_ENV

      # Patch tauri.conf.json version
      - name: Patch tauri.conf.json version
        shell: bash
        run: |
          jq --arg v "$APP_VERSION" '.version = $v' apps/client/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/client/src-tauri/tauri.conf.json

      # Build Tauri release
      - name: Build Tauri app
        run: pnpm --filter client tauri build
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # List bundle artifacts
      - name: List bundle artifacts
        shell: bash
        run: find apps/client/src-tauri/target/release/bundle -type f | sort

      # Generate update manifest
      - name: Generate update manifest
        shell: bash
        run: |
          NSIS_DIR="apps/client/src-tauri/target/release/bundle/nsis"
          EXE_FILE=$(find "$NSIS_DIR" -name "*.exe" | head -1)
          if [ -z "$EXE_FILE" ]; then
            echo "No .exe found in NSIS bundle directory."
            exit 1
          fi
          EXE_NAME=$(basename "$EXE_FILE")
          SIGNATURE=$(cat "${EXE_FILE}.sig")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${EXE_NAME}"
          jq -n \
            --arg version "$APP_VERSION" \
            --arg notes "" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg sig "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"windows-x86_64":{signature:$sig,url:$url}}}' \
            > latest.json

      # Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/src-tauri/target/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/client/src-tauri/target/release/bundle/msi/*.msi
            apps/client/src-tauri/target/release/bundle/msi/*.msi.sig
            latest.json
          generate_release_notes: true