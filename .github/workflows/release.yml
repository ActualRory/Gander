name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gander/shared build

      - name: Extract version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Patch tauri.conf.json version
        shell: bash
        run: |
          jq --arg v "$APP_VERSION" '.version = $v' apps/client/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/client/src-tauri/tauri.conf.json

      - name: Build Tauri app
        run: pnpm --filter client tauri build
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate update manifest
        shell: bash
        run: |
          NSIS_DIR="apps/client/src-tauri/target/release/bundle/nsis"
          ZIP_FILE=$(ls "$NSIS_DIR"/*.nsis.zip | head -1)
          ZIP_NAME=$(basename "$ZIP_FILE")
          SIGNATURE=$(cat "${ZIP_FILE}.sig")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${ZIP_NAME}"
          jq -n \
            --arg version "$APP_VERSION" \
            --arg notes "" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg sig "$SIGNATURE" \
            --arg url "$DOWNLOAD_URL" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"windows-x86_64":{signature:$sig,url:$url}}}' \
            > latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/src-tauri/target/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/release/bundle/nsis/*.nsis.zip
            apps/client/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            apps/client/src-tauri/target/release/bundle/msi/*.msi
            latest.json
          generate_release_notes: true
